<!DOCTYPE html>
<head>
  <meta charset="utf-8" />
  <title> Final </title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
    <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>

    <script>
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// Camera
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(10, 1, 2);
camera.lookAt(0, 1, 0);
const controls = new THREE.OrbitControls(camera, renderer.domElement);

// Floor (เปลี่ยนเป็นวงกลม)
const textureLoader = new THREE.TextureLoader();
const floorTexture = textureLoader.load('https://raw.githubusercontent.com/Pongpanot99/final.github.io/main/p1.jpg');
floorTexture.wrapS = THREE.RepeatWrapping;
floorTexture.wrapT = THREE.RepeatWrapping;
floorTexture.repeat.set(4, 4); 

const floorGeometry = new THREE.CircleGeometry(12, 64);
const floorMaterial = new THREE.MeshStandardMaterial({ 
  map: floorTexture,
  roughness: 0.0
});
const floor = new THREE.Mesh(floorGeometry, floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
floor.position.set(0, 0.31, 0);

const pillarHeight = 0.3; // ความสูงเสา
const pillarGeometry = new THREE.CylinderGeometry(12, 12, pillarHeight, 64);
const pillarMaterial = new THREE.MeshStandardMaterial({
  color: 0x8B4513, // สีของเสา
  roughness: 0.6
});
const pillar = new THREE.Mesh(pillarGeometry, pillarMaterial);
pillar.position.y = pillarHeight / 2; // วางเสาให้รับพื้น
scene.add(pillar);

const material2 = new THREE.MeshStandardMaterial({ color: 0xA9A9A9, metalness: 0.9, roughness: 0.2 });
const glassMaterial = new THREE.MeshPhysicalMaterial({color: 0xffffff,metalness: 0,roughness: 0,transmission: 1.0,
  transparent: true,opacity: 1.0,ior: 1.5,thickness: 0.5,clearcoat: 1.0,clearcoatRoughness: 0 });


  // โหลดโมเดลหลัก
  const gltfLoader = new THREE.GLTFLoader();

let waterModel; // ประกาศตัวแปรเก็บโมเดลไว้ข้างนอก

gltfLoader.load("https://raw.githubusercontent.com/Pongpanot99/final.github.io/main/water.glb", function(gltf) {
  waterModel = gltf.scene;
  waterModel.scale.set(0.5, 0.5, 0.5);
  waterModel.traverse(c => {
    if (c.isMesh) {
      c.castShadow = true;
      c.receiveShadow = true;
    }
  });
  scene.add(waterModel);
  waterModel.position.set(0, -1.5, 0);
});

gltfLoader.load("https://raw.githubusercontent.com/Pongpanot99/final.github.io/main/colos2.glb", function(gltf) {
    const model = gltf.scene;
    model.scale.set(1.0, 1.0, 1.0);
    model.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; }});
    scene.add(model);
    model.position.set(0, 0.45, 0)
  });

  //Light
const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(0xffeedd, 0.9);
directionalLight.position.set(10, 5, 10);
directionalLight.castShadow = true;
scene.add(directionalLight);

// ===== สร้าง Point Light ===== 
/*
            const pointLight = new THREE.PointLight(0xf115ff, 100, 5); // (สี, ความเข้ม, ระยะ)
            pointLight.position.set(3, 1, 3);
            scene.add(pointLight); */ 

            // HDRI
const pmremGenerator = new THREE.PMREMGenerator(renderer);
pmremGenerator.compileEquirectangularShader();

new THREE.RGBELoader()
  .setDataType(THREE.UnsignedByteType)
  .load(
    'https://raw.githubusercontent.com/Pongpanot99/final.github.io/main/puresky_2k.hdr',
    (hdrTexture) => {
      const envMap = pmremGenerator.fromEquirectangular(hdrTexture).texture;
      scene.background = envMap;
      scene.environment = envMap;
      hdrTexture.dispose();
      pmremGenerator.dispose();
    }
  );

  //click

  const clickable = [];

  function addObj(mesh, pos, name) {
    mesh.position.copy(pos);
    mesh.name = name;
    scene.add(mesh);
    clickable.push(mesh);
    return mesh;
            }

            addObj(
          new THREE.Mesh(
          new THREE.BoxGeometry(0.8, 0.8, 0.8),
          glassMaterial),new THREE.Vector3(-2, 0.4, 0),
          'Box'
);

            addObj(
                new THREE.Mesh(new THREE.SphereGeometry(0.45, 32, 16), glassMaterial),
                new THREE.Vector3(3.0, 1.0, 3.0),
                'Sphere'
            );

            const sphere = new THREE.Mesh(
            new THREE.SphereGeometry(0.35, 32, 16),
            new THREE.MeshBasicMaterial({ color: 0x00ff00 , metalness: 0.9})
            );
            sphere.position.set(3.0, 1.0, 3.0);
            scene.add(sphere);

            addObj(
                new THREE.Mesh(new THREE.ConeGeometry(0.5, 1, 24), new THREE.MeshBasicMaterial({ color: 0x5db6ff })),
                new THREE.Vector3(2, 0.5, 0),
                'Cone'
            );
           

            // --- พรีเซ็ตตำแหน่งกล้องต่อวัตถุ (กำหนดง่าย ๆ) ---
            const VIEWS = {
                Box: { pos: new THREE.Vector3(-3, 1.4, 1.6), tar: new THREE.Vector3(-2, 0.4, 0) },
                Sphere: { pos: new THREE.Vector3(3, 1.8, 0), tar: new THREE.Vector3(0, 0.45, 0) },
                Cone: { pos: new THREE.Vector3(3, 1.6, -2.0), tar: new THREE.Vector3(2, 0.5, 0) },
            };

            // --- Raycaster + คลิกเพื่อสลับมุม ---
            const raycaster = new THREE.Raycaster();
            const pointer = new THREE.Vector2();
            let pickedObjPostion = new THREE.Vector3();

            function setPointer(e) {
                const r = renderer.domElement.getBoundingClientRect();
                const x = (e.clientX ?? e.touches[0].clientX) - r.left;
                const y = (e.clientY ?? e.touches[0].clientY) - r.top;
                pointer.x = (x / r.width) * 2 - 1;
                pointer.y = -(y / r.height) * 2 + 1;

            }

            function onPick(e) {
                setPointer(e);
                raycaster.setFromCamera(pointer, camera);
                const hit = raycaster.intersectObjects(clickable, false)[0];
                if (!hit) 
                    return;
                const view = VIEWS[hit.object.name];
                pickedObjPostion = hit.object.position;
                if (!view) return;

                // ย้ายแบบทันที (ถ้าอยากนุ่ม ๆ ค่อยเสริม lerp ทีหลัง)
                camera.position.copy(view.pos);
                //controls.target.copy(view.tar);
                controls.update();
            }

            renderer.domElement.addEventListener('click', onPick);
            renderer.domElement.addEventListener('touchend', (e) => { onPick(e); }, { passive: true });

            addEventListener('resize', () => {
                camera.aspect = innerWidth / innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(innerWidth, innerHeight);
            });
            function lerp(a, b, t) {
                return a + (b - a) * t;   // t ใน [0..1]
            }

let clock = new THREE.Clock();

function animate() {
  controls.update();
  controls.target.lerp(pickedObjPostion,0.02)
  const t = clock.getElapsedTime();

  // ถ้ามีโมเดลน้ำแล้ว ค่อยทำให้มันขยับ
  if (waterModel) {
    // ขยับขึ้นลงแบบคลื่น sin
    waterModel.position.y = -2 + Math.sin(t * 2) * 0.2;
    // หมุนๆ
    waterModel.rotation.y = Math.sin(t * 0.5) * 0.4;
  }
  
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>

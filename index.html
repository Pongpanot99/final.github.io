          color: child.material.color || new THREE.Color(0x0090aa),
          flatShading: true,
        });
        child.material = toonMat;
        child.castShadow = true;
        child.receiveShadow = true;

        // เพิ่มขอบ (outline)

          color: 0x009099,
          side: THREE.BackSide,
        }));
        outline.scale.multiplyScalar(1.05);
        outline.position.copy(child.position);
        outline.quaternion.copy(child.quaternion);
        child.parent?.add(outline);
      }
    });

    // ปรับขนาดและตำแหน่งฉลาม
    sharkModel.scale.set(1, 1, 1);

// Rain 
const RAIN_COUNT = 800;
let rainGeo, rainMaterial, rainPoints;
const rainVel = new Float32Array(RAIN_COUNT);
let rainLast = 0;
function initRain() {
  rainGeo = new THREE.BufferGeometry();
  const positions = new Float32Array(RAIN_COUNT * 3);

  for (let i = 0; i < RAIN_COUNT; i++) {
    positions[i * 3 + 0] = (Math.random() - 0.5) * 40;  // X
    positions[i * 3 + 1] = Math.random() * 25 + 5;       // Y
    positions[i * 3 + 2] = (Math.random() - 0.5) * 40;  // Z
    rainVel[i] = 10 + Math.random() * 20; // ความเร็วตก (หน่วย/วินาที)
  }

  const posAttr = new THREE.BufferAttribute(positions, 3);
  posAttr.setUsage(THREE.DynamicDrawUsage); // ให้ตำแหน่งอัปเดตได้ทุกเฟรม
  rainGeo.setAttribute('position', posAttr);

  rainMaterial = new THREE.PointsMaterial({
    color: 0x99ccff,
    size: 0.12,
    transparent: true,
    opacity: 0.75,
    depthWrite: false
  });

  rainPoints = new THREE.Points(rainGeo, rainMaterial);
  rainPoints.frustumCulled = false;
  scene.add(rainPoints);

  rainLast = performance.now();
}
function updateRain() {
  if (!rainGeo) return;
  const now = performance.now();
  const dt = Math.min(0.1, (now - rainLast) / 1000);
  rainLast = now;

  const pos = rainGeo.attributes.position.array;
  for (let i = 0; i < RAIN_COUNT; i++) {
    const yIndex = i * 3 + 1;
    pos[yIndex] -= rainVel[i] * dt;
    if (pos[yIndex] < 0) {
      // ถ้าตกถึงพื้น ให้รีเซ็ตขึ้นไปด้านบน
      pos[i * 3 + 0] = (Math.random() - 0.5) * 40;
      pos[i * 3 + 1] = Math.random() * 25 + 10;
      pos[i * 3 + 2] = (Math.random() - 0.5) * 40;
      rainVel[i] = 10 + Math.random() * 20;
    }
  }

  rainGeo.attributes.position.needsUpdate = true;
}
initRain();

// ---------------- UFO Vertex Shader ----------------
const ufoUniforms = {
  time: { value: 0 },
  wobble: { value: 0.3 },
  hoverHeight: { value: 0.0 },
  baseColor: { value: new THREE.Color(0x9ecfd4) },
  rimColor: { value: new THREE.Color(0x132440) },
};
const ufoVertexShader = `
  varying vec3 vPos;
  uniform float time;
  uniform float wobble;
  uniform float hoverHeight;

  void main() {
    vPos = position;

    float r = length(position.xz);

    // ขอบยกนิดหน่อย
    float rim = smoothstep(1.1, 1.5, r) * -0.6;

    // สั่น ๆ แบบคลื่น
    float wave = sin(r * 6.0 + time * 3.0) * 0.03 * wobble;

    vec3 displaced = position;
    displaced.y += rim + wave + hoverHeight;

    gl_Position = projectionMatrix * modelViewMatrix * vec4(displaced, 1.0);
  }
`;
const ufoFragmentShader = `
  varying vec3 vPos;
  uniform float time;
  uniform vec3 baseColor;
  uniform vec3 rimColor;
  uniform vec3 glowColor;

  void main() {
    float r = length(vPos.xz);

    // สีหลัก UFO
    vec3 color = baseColor;

    // ขอบเรืองแสง
    float rim = smoothstep(1.0, 1.6, r);
    color = mix(color, rimColor, rim);

    // จุดไฟหมุนรอบ ๆ
    float ang = atan(vPos.z, vPos.x);
    float blink = smoothstep(0.98, 1.0, sin(ang * 6.0 + time * 6.0));
    color += glowColor * blink * 0.3;

    gl_FragColor = vec4(color, 1.0);
  }
`;
// สร้างทรง UFO 
const ufoGeometry = new THREE.CylinderGeometry(2, 2, 0.1 , 24);
const ufoMaterial = new THREE.ShaderMaterial({
  vertexShader: ufoVertexShader,
  fragmentShader: ufoFragmentShader,
  uniforms: ufoUniforms,
  side: THREE.DoubleSide,
});
const ufo = new THREE.Mesh(ufoGeometry, ufoMaterial);
ufo.position.set(12, 5, -10); // จุดเริ่มลอยเหนือฉาก

let camTargetPos = camera.position.clone();
let camTargetLook = controls.target.clone();
let isMovingToTarget = false;
let followMode = null; 
let clock = new THREE.Clock();
let fogEnabled = true;

function animate() {
  if (isMovingToTarget) {
  camera.position.lerp(camTargetPos, 0.05);
  controls.target.lerp(camTargetLook, 0.05);
  
  if (camera.position.distanceTo(camTargetPos) < 0.01) {
    isMovingToTarget = false;
  }
}
  controls.update();
  const t = clock.getElapsedTime();

  if (waterModel) {
    // ขยับขึ้นลงแบบคลื่น sin
    waterModel.position.y = -2 + Math.sin(t * 2) * 0.2;
    // หมุนๆ
    waterModel.rotation.y = Math.sin(t * 0.5) * 0.4;
  }
  if (sharkModel && ufo ) {

  const radius = 18; // รัศมีรอบเสา (อยากให้ใกล้/ไกลก็เปลี่ยนได้)
  const speed = 0.2 ; // ความเร็วรอบ
  const angle = t * speed;
  const centerX = 0;
  const centerZ = 0;

  sharkModel.position.x = centerX + Math.cos(angle) * radius;
  sharkModel.position.z = centerZ + Math.sin(angle) * radius;
  
  // ขยับขึ้นลงเล็กน้อยให้เหมือนว่ายน้ำ
  sharkModel.position.y = -2.8 + Math.sin(t * 2) * 0.2;
  // 🦈 หมุนหัวฉลามให้หันตามทิศทางการว่าย
  sharkModel.rotation.y = -angle + Math.PI / 2 - THREE.MathUtils.degToRad(90);

 // 🛸 UFO เคลื่อนที่
  const ufoAngle = angle + Math.PI / -2.5; 
  ufo.position.x = centerX + Math.cos(ufoAngle) * radius;
  ufo.position.z = centerZ + Math.sin(ufoAngle) * radius;
  ufoLight.position.z = centerZ + Math.sin(ufoAngle) * radius;
  ufoLight.position.x = centerX + Math.cos(ufoAngle) * radius;
  


  ufo.position.y = 8 + Math.sin(clock.elapsedTime * 1.5) * 0.5;
  ufoUniforms.time.value += clock.getDelta();
  ufoUniforms.hoverHeight.value = Math.sin(clock.elapsedTime * 2.0) * 0.3;
}
  if (followMode === "shark" && sharkModel) {
  const sharkPos = sharkModel.position.clone();

  const offset = new THREE.Vector3(5, 4, 5);
  
  // ให้กล้องอยู่ด้านหลังตามทิศหมุนของฉลาม
  const rotationY = sharkModel.rotation.y;
 const rotatedOffset = offset.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), rotationY + Math.PI / 2);

  const targetCamPos = sharkPos.clone().add(rotatedOffset);
  camera.position.lerp(targetCamPos, 0.05); // เคลื่อนกล้องนุ่มนวล
  const targetLook = sharkPos.clone().add(new THREE.Vector3(0, 3, 0));
  controls.target.lerp(targetLook, 0.1);
}

if (followMode === "UFO" && ufo) {
  const ufoPos = ufo.position.clone();

  const offset = new THREE.Vector3(5, 4, 5);
  
  // ให้กล้องอยู่ด้านหลังตามทิศทางของ UFO (หมุนรอบศูนย์กลางเหมือนฉลาม)
  const rotationY = Math.atan2(
    -Math.sin(clock.elapsedTime * 0.2),
    Math.cos(clock.elapsedTime * 0.2)
  );

  const rotatedOffset = offset.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), rotationY + Math.PI / 2);

  const targetCamPos = ufoPos.clone().add(rotatedOffset);
  camera.position.lerp(targetCamPos, 0.05); // เคลื่อนกล้องนุ่มนวล
  const targetLook = ufoPos.clone().add(new THREE.Vector3(0, 1.5, 0));
  controls.target.lerp(targetLook, 0.1);
}

  updateRain();
  
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
